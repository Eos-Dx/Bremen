  status: verified
  hops:
    - hop: 1
      from: "workflow_bremen.py prepare_input() / execute()"
      to: "WorkflowResult.payload"
      code_lines: "workflow_bremen.py L392-395, L439-474"
      evidence: "execute() calls run_inference() then accesses result.payload at L395"
    - hop: 2
      from: "WorkflowResult.payload"
      to: "result_dict in app.py"
      code_lines: "app.py L303-313"
      evidence: "payload dict fields mapped into result_dict"
    - hop: 3
      from: "result_dict"
      to: "build_decision_support_report()"
      code_lines: "app.py L317; decision_support.py L53-147"
      evidence: "result_dict passed as inference_result to build_decision_support_report()"
    - hop: 4 (other call sites)
      from: "feature_artifact_prediction.py L203, inference_handler.py L119"
      to: "build_decision_support_report()"
      handling: "Counts absent → reliability field omitted (correct fallback)"
    preferred_approach: "Direct count computation from canonical.measurements in execute()"
    verifies_return_value_discarded: true
    verifies_other_call_sites: true
tier_logic:
  tier_names:
    - HIGH_TECHNICAL
    - ACCEPTABLE_TECHNICAL
    - LOW_TECHNICAL
  thresholds:
    - "left >= 3 AND right >= 3 => HIGH_TECHNICAL"
    - "left >= 2 AND right >= 2 => ACCEPTABLE_TECHNICAL"
    - "else => LOW_TECHNICAL"
  reason_strings:
    - "At least three accepted measurements per breast."
    - "At least two accepted measurements per breast."
    - "Fewer than two accepted measurements on one breast."
  source: "Verbatim from bremen-training-pipeline (declared in PLAN.md)"
  count_computation: "sum(1 for m in measurements if getattr(m, 'side', None) == 'LEFT') / 'RIGHT')"
  match_with_contract: true
naming_guard:
  top_level_reliability_or_reliability_reason: false
  evidence: "PLAN.md NAMING GUARD section explicitly prohibits top-level
    `reliability` and `reliability_reason`.  The only `reliability`-bearing
    key is `prediction_summary.measurement_reliability`.  No top-level
    `reliability` or `reliability_reason` field appears anywhere in PLAN.md."
  measurement_count_mixed_with_model_maturity: false
  evidence_model: "PLAN.md NAMING GUARD states PR0096 reliability means 'only
    per-side measurement technical reliability based on LEFT/RIGHT accepted
    measurement counts.'  It explicitly rejects overloading
    `measurement_reliability` with model-validation meaning and directs
    model/scientific maturity to existing fields (`scientific_certification`,
    `technical_demo_only`)."
  measurement_qualifier_in_json: true
  evidence_qualifier: "JSON key is `prediction_summary.measurement_reliability`
    everywhere in PLAN.md — never `prediction_summary.reliability`.  Function
    is named `_compute_measurement_reliability()`.  All prose uses 'measurement
    reliability' or 'technical measurement reliability'."
json_contract_placement:
  location: "prediction_summary.measurement_reliability"
  shape:
    tier: "HIGH_TECHNICAL | ACCEPTABLE_TECHNICAL | LOW_TECHNICAL"
    reason: "string matching training-side source"
    left_measurement_count: "int"
    right_measurement_count: "int"
  absent_when: "left_measurement_count or right_measurement_count is None"
  rationale: "Reliability describes prediction quality context, same dimension as qc_status/qc_flags"
  internal_report_passthrough: "Automatic via _get_path(external, 'prediction_summary') in build_internal_report_json()"
  internal_rendering: "renderFieldTable entry under 'Measurement Reliability' heading, after Decision Policy, before Boundary Note"
