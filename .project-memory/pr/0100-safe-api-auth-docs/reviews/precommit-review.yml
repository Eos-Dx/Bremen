confirmed_current_state_documented: "Documents: /demo/* routes are unauthenticated today, no JWT library present, no password hashing library present, adding PyJWT/bcrypt/argon2/passlib/cryptography is a future dependency decision, auth implementation will be a follow-up PR."
open_decision_1_visibility: "Option 1a (auth gates actions only) and Option 1b (authenticated users get fuller view) documented. Recommended default: auth gates actions only. Authenticated users still receive same safe payloads. Authentication must not unlock full checksums, raw feature values, raw H5 internals, raw S3 refs, model coefficients, model package internals, PHI, raw exception traces. States: any future fuller authenticated view requires a separate PR and safety review."
open_decision_2_credentials: "Documents: initial demo credential source is environment variables, single demo username/password planned, password stored as hash not plaintext, no default credentials in repository, no credentials in frontend JavaScript, no credentials in logs, auth fails closed if enabled and required env vars missing. All 8 planned env vars documented (BREMEN_AUTH_ENABLED through BREMEN_AUTH_REFRESH_TTL_SECONDS). States: BREMEN_AUTH_JWT_SECRET must be independently generated and distinct from password hash."
open_decision_3_refresh_storage: "Three options documented: 3a (in-memory, restart invalidates), 3b (stateless refresh JWT, no true revocation), 3c (persistent store, more infrastructure). Recommended demo-stage default: stateless refresh JWT. States: real logout/revoke requires server-side token state later."
jwt_mechanics_documented: "Planned library: PyJWT. Algorithm: HS256. Claims: sub, iat, exp, iss, aud, token_type. Optional: jti. Access token TTL: 15 minutes. Refresh token TTL: 7 days. Decode must explicitly specify allowed algorithms. Implementation must not trust token header algorithm. JWT signing secret must be sufficiently long, random, independently generated."
auth_does_not_expand_visibility: "Safety invariant explicitly documented: auth does not expand data visibility. No raw features, full checksums, H5 internals, model internals, S3 references, PHI, or exception traces unlocked by login. Fuller view requires separate PR + safety review."
future_fuller_view_requires_review: "Explicitly stated: 'Any future fuller authenticated view requires a separate PR and safety review.' Documented as safety invariant."
auth_model_documented: "Planned endpoints: POST /api/auth/token, POST /api/auth/refresh, POST /api/auth/logout (planned later). Authorization: Bearer <access_token> usage documented. All endpoints clearly marked as 'Planned' with badge indicators."
jwt_refresh_token_documented: "Access token TTL: 15 minutes. Refresh token TTL: 7 days. Stateless refresh JWT recommended as demo default with explicit trade-off noted."
env_credentials_documented: "All 8 planned env vars documented: BREMEN_AUTH_ENABLED, BREMEN_AUTH_USERNAME, BREMEN_AUTH_PASSWORD_HASH, BREMEN_AUTH_JWT_SECRET, BREMEN_AUTH_JWT_ISSUER, BREMEN_AUTH_JWT_AUDIENCE, BREMEN_AUTH_ACCESS_TTL_SECONDS, BREMEN_AUTH_REFRESH_TTL_SECONDS. Password handling: store hash not plaintext. No default credentials. No credentials in frontend JS. No credentials in logs. Fail closed if enabled and env vars missing."
