root_cause: The normal pytest suite started real HTTPServer instances on daemon threads and made real HTTP requests via urllib.request.urlopen, causing ConnectionResetError noise, port conflicts, slow execution, and suite instability. After server removal, coverage dropped to 74.87% against 80% fail-under.
coverage_failure_summary: CI showed 2959 passed, 11 skipped, coverage total 74.87%, fail-under 80%. Coverage failure only — all tests passed.
coverage_recovery_strategy: Added 94 no-socket unit tests across two new test files (test_bremen_server_helpers.py: 58 tests, test_bremen_job_api_handler.py: 36 tests) and expanded two existing test files (test_bremen_demo_run.py: +9 output field tests, test_bremen_demo_smoke.py: +3 source safety tests). All tests use direct function calls, FastAPI TestClient, monkeypatch, or AST/source inspection. No HTTPServer, no sockets, no localhost HTTP.
