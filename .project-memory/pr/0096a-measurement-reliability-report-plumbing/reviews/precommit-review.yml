bug_summary:
  observed: "Counts present in workflow_runs.bremen.result_summary but measurement_reliability null in report JSON."
  broken_hop: "BremenReportProvider._build_report() never read left_measurement_count/right_measurement_count from workflow_result. build_external_report_json() only read measurement_reliability from legacy decision_support_report path (empty in v0.2)."
  fix: "Three-part fix: (1) app.py removes default=0 so absent counts stay None, (2) report_bremen.py reads counts from workflow_result and computes measurement_reliability into v0.2 payload, (3) report_ui.py adds payload fallback path for measurement_reliability via _first_present()."
broken_plumbing_hop:
  source: "workflow_runs.bremen.result_summary (contains left_measurement_count, right_measurement_count)"
  destination: "report JSON prediction_summary.measurement_reliability / decision_policy.measurement_reliability"
  gap: "BremenReportProvider._build_report() did not extract counts from workflow_result dict; report_ui.py build_external_report_json() did not fall back to payload.measurement_reliability"
  fix_gap: true
fix_summary:
  app_py: "Changed `payload.get('left_measurement_count', 0)` to `payload.get('left_measurement_count')` — absent counts now stay None instead of defaulting to 0 (which would fabricate LOW_TECHNICAL)."
  report_bremen_py: "Added measurement_reliability computation: extracts left_count/right_count from workflow_result, calls _compute_measurement_reliability() (lazy-imported from decision_support.py), includes result in payload dict."
  report_ui_py: "Changed measurement_reliability lookup from single-path _get_path(ds, 'prediction_summary', 'measurement_reliability') to _first_present() with three fallback paths: (1) legacy decision_support_report.prediction_summary, (2) legacy prediction_summary direct, (3) v0.2 payload direct (the new path)."
  tests: "Added TestPR0096AReportPlumbing class with 6 regression tests: external with counts, internal with counts, absent-count external (no fabrication), absent-count internal (no fabrication), HIGH_TECHNICAL tier, legacy path compatibility."
