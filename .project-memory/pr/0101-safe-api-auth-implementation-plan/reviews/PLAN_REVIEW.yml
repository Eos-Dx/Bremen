  true_logout_revocation_requires_server_state: true
dependency_decision:
  pyjwt:
    purpose: JWT creation (jwt.encode) and validation (jwt.decode)
    algorithm: HS256
    version: ">=2.0"
    safety: jwt.decode called with explicit algorithms=["HS256"], never from header
    alternatives_rejected: stdlib-only (no built-in JWT), python-jose (heavier, less maintained)
  argon2_cffi:
    purpose: Password hashing and verification
    justification: Argon2id is OWASP/NIST recommended, memory-hard, GPU/ASIC resistant
    alternatives_considered:
      - bcrypt (acceptable alternative, less hardware-resistant)
      - hashlib/pbkdf2 (rejected, weaker)
    implementation_note: argon2.PasswordHasher API
  dependency_changes: Belong in PR0102 only, not modified in PR0101
config_design:
  module: src/bremen/config.py (AuthConfig dataclass with read_auth_config factory)
  pattern: Follows existing read_cloud_config() pattern with injected env dict for testability
  env_vars:
    - BREMEN_AUTH_ENABLED (default: "false")
    - BREMEN_AUTH_USERNAME (required if enabled)
    - BREMEN_AUTH_PASSWORD_HASH (required if enabled, argon2id/bcrypt prefix check)
    - BREMEN_AUTH_JWT_SECRET (required if enabled, >=32 chars, distinct from hash)
    - BREMEN_AUTH_JWT_ISSUER (optional, default "bremen-demo")
    - BREMEN_AUTH_JWT_AUDIENCE (optional, default "bremen-api")
    - BREMEN_AUTH_ACCESS_TTL_SECONDS (default 900, clamped 60-86400)
    - BREMEN_AUTH_REFRESH_TTL_SECONDS (default 604800, clamped 3600-2592000)
  validation: read_auth_config never raises; validation_error field on failure; enabled=False on error
  issuer_audience_decision: Optional for demo; enforced on decode when set; absent omits iss/aud validation
auth_module_design:
  file: src/bremen/auth.py
  public_api:
    - verify_password(password, password_hash) -> bool
    - create_access_token(config, username) -> str
    - create_refresh_token(config, username) -> str
    - decode_access_token(config, token) -> TokenClaims
    - decode_refresh_token(config, token) -> TokenClaims
    - authenticate_credentials(config, username, password) -> TokenPair | None
    - authenticate_request(config, authorization_header) -> TokenClaims | None
  exception_types:
    - AuthError (base)
    - AuthenticationFailedError
    - TokenExpiredError
    - TokenInvalidError
  claims:
    - sub (username)
    - iat (now)
    - exp (now + TTL)
    - token_type ("access" / "refresh")
    - jti (random UUID)
    - iss (when configured)
    - aud (when configured)
endpoint_design:
  token_endpoint:
    method: POST
    path: /demo/api/auth/token
    request_shape: '{"username": "<str>", "password": "<str>"}'
    success_response: '{"access_token": "<jwt>", "refresh_token": "<jwt>", "token_type": "Bearer", "expires_in": 900}'
    error_401: '{"error": "Authentication failed", "token_type": "Bearer"}'
    error_503: '{"error": "Authentication is not configured"}' (auth disabled)
  refresh_endpoint:
    method: POST
    path: /demo/api/auth/refresh
    request_shape: '{"refresh_token": "<jwt>"}'
    success_response: '{"access_token": "<jwt>", "refresh_token": "<jwt>", "token_type": "Bearer", "expires_in": 900}'
    error_401: '{"error": "Authentication failed", "token_type": "Bearer"}' (invalid/expired/wrong type)
  error_response_shape: '{"error": "Authentication failed", "token_type": "Bearer", "technical_demo_only": true}'
  safety: no detail, no reason, no stack trace, no config reference in errors
route_protection_design:
  mechanism: _require_auth() wrapper function in server.py (Approach A preferred)
  protected_routes:
