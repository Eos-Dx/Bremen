blockers: []
warnings:
  - |
    Stateless refresh JWT means no true server-side revocation before natural
    token expiry (documented in PLAN.md WARNINGS and THREAT_MODEL.md). Logout
    can only discard client-side token. True revocation deferred to future PR
    with server-side token state.
  - |
    No rate limiting on the token endpoint in demo stage. Argon2id slows
    brute-force attempts but does not prevent them. Explicitly deferred in
    PLAN.md and discussed in THREAT_MODEL.md as a known residual risk.
  - |
    Frontend token storage in sessionStorage is same-origin accessible by any
    JavaScript. Acknowledged as acceptable for demo stage where no third-party
    scripts are served. Re-evaluation needed if third-party content is
    introduced.
