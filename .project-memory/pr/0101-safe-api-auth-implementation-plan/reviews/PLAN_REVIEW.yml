  default_state: Auth disabled by default (BREMEN_AUTH_ENABLED=false)
  local_example: .env.example with all auth vars commented and placeholder values
  deployment_instructions: Generate JWT secret, generate password hash, set env vars, verify 401 on protected routes, verify 200 on public routes
  manual_qa: 12-step checklist covering all auth scenarios (no-auth start, partial config, full config, valid credentials, invalid credentials, access token, expired token, refresh flow, wrong type on refresh, public routes, log check, full suite)
  stop_conditions: 8 conditions documented (raw data exposure, persistent store requirement, route safety, dependency conflict, token storage safety, test coverage gap, existing test breakage, page content change)
safety_invariants:
  - Auth gates actions only, not data
  - Auth does not expand data visibility
  - No raw/private/internal fields unlocked by login
  - Fail closed (missing required vars -> 503, not partial auth)
  - No secrets in frontend JS
  - No secrets in logs
  - No default credentials in repository
  - No credentials in frontend code
auth_does_not_expand_visibility:
  status: confirmed
  evidence: "PLAN.md Security Invariant 2: 'Auth does not expand data visibility — authenticated users receive the same safe payloads as public demo users.' Invariant 3 specifically prohibits unlocking raw feature values, full checksums, raw H5 internals, raw S3 refs, model coefficients, PHI, model package internals, raw exception traces."
  test_coverage: test_auth_does_not_expand_report_payload, test_no_full_checksums_after_auth, test_no_raw_features_after_auth
  stop_condition: "If any protected endpoint needs raw data to function, stop and escalate"
refresh_token_tradeoff:
  status: documented
  evidence: "PLAN.md WARNINGS: 'Stateless refresh JWT trade-off: No true server-side revocation before natural expiry.' THREAT_MODEL.md: 'Without server-side token state, a stolen refresh token cannot be explicitly revoked before expiry.'"
  stateless_design: true
  future_revocation: Database-backed token blacklist (future PR)
jwt_algorithm_safety:
  algorithm: HS256
  decode_enforcement: Explicit algorithms=["HS256"]
  header_algorithm_not_trusted: true
  token_type_validated: true
  exp_validated: true
  issuer_audience_validated_when_configured: true
  tests:
    - test_decode_uses_explicit_algorithm
    - test_algorithm_header_confusion_rejected (alg="none")
    - test_algorithm_header_confusion_hs512
    - test_expired_token_rejected
    - test_wrong_token_type_rejected
    - test_wrong_issuer_rejected
    - test_wrong_audience_rejected
  residual_risk: Eliminated by explicit algorithm enforcement
