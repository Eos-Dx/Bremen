    - GET /demo/workspace
    - GET /demo/report/*
    - GET /demo/api-docs
    - GET /demo/api/models
    - GET /demo/api/evidence
    - GET /demo/api/h5/containers
    - GET /demo/api/jobs
    - GET /demo/api/jobs/*
    - GET /demo/api/reports/*
    - GET /health
    - GET /model/version
    - GET /predictions/*
  safety: Auth gates action execution only, not data visibility; same handler functions for authed/unauthed
frontend_integration_plan:
  login_page: /demo/login (separate minimal page, not modal)
  token_storage: sessionStorage
  token_storage_justification: Cleared on tab close; does not survive browser restart; safer than localStorage
  token_storage_risk: Same-origin JavaScript accessible (acceptable for demo stage with no third-party scripts)
  fetch_wrapper: _authFetch() attaches Bearer, handles 401 -> refresh -> retry
  refresh_flow: Check expiry before call; on 401 attempt refresh; on failure clear sessionStorage, redirect to login
  no_credentials_in_frontend: Hardcoded credentials never appear in HTML/JS/CSS
safe_error_handling:
  generic_auth_error: '{"error":"Authentication failed","token_type":"Bearer"}'
  auth_disabled_error: '{"error":"Authentication is not configured"}'
  no_stack_traces: true
  no_config_details: true
  no_jwt_internals: true
  no_timing_verbose_differences: true
  safe_logging:
    - No password, hash, token, or secret values in logs
    - Safe log strings: "auth.login.failed\tusername=<safe>", "auth.token.issued"
    - INFO for success, WARNING for failed attempts
threat_model:
  file: THREAT_MODEL.md
  threats_covered:
    - Stolen access token (short TTL mitigation)
    - Stolen refresh token (sessionStorage, rotation; no revocation gap acknowledged)
    - Leaked JWT secret (never logged, >=32 chars, distinct from hash)
    - Brute force login (generic errors, argon2id; no rate limiting gap acknowledged)
    - Algorithm confusion (explicit algorithms=["HS256"] eliminates risk)
    - Replay of refresh token (works until expiry; accepted trade-off)
    - Multi-instance signing (stateless JWT with shared secret)
    - Log leakage (safe logging rules)
    - XSS token theft (sessionStorage risk acknowledged)
    - Accidental data exposure after auth (architecture invariant eliminates)
  residual_risks_documented: true
