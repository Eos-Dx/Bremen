  details: "Allowlist parsing is exact, deterministic and disabled by default; runtime_release alone does not enable it. Registry wiring selects SubprocessRuntime only for opted-in entries."

RELEASE CACHE INTEGRATION:
  result: block
  finding: >-
    SubprocessRuntime._invoke calls ReleaseCache.install(), but the real
    registry/executor candidate path is not proven to reach that call. More
    seriously, registry construction calls runtime.model_ready(); this only
    resolves a READY marker and does not install. When an opted-in release is
    not already READY, executor.py returns workflow-unavailable before
    SubprocessRuntime._invoke can call install. Focused tests use a fake cache
    that is already ready and do not cover get_descriptor_for_model plus a
    not-yet-installed catalog entry. Add an integration test and smallest
    wiring fix proving the production candidate path obtains InstalledRelease
    through ReleaseCache.install()/READY validation.

