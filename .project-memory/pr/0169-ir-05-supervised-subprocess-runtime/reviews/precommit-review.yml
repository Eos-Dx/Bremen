    aramina_public_failure_contract:
      status: BLOCKED
      finding: >-
        The real AraminaWorkflowError.preprocessing_diagnostic is
        dict[str, str] | None. ml_plugin/inference.py only transports the
        details field when that value is a non-empty string, so real
        preprocessing diagnostics are dropped. runtime_projection.py also
        reconstructs from any JSON-safe details mapping containing
        failure_stage and accepts arbitrary preprocessing_diagnostic content;
        typed candidate failures such as unsupported artifact/identity
        mismatch still map to generic ARAMINA_EXECUTION_FAILED. The legacy
        error, failure_stage and preprocessing_diagnostic contract is therefore
        not preserved and the details boundary is not allowlisted at the
        projection point.
      required_action: >-
        Define and enforce the exact safe Aramina details schema (including the
        dict diagnostic shape and allowed keys/stages), emit it from the plugin,
        validate it before projection, and add tests for INPUT_INVALID, QC_FAILED,
