ERROR MAPPING:
  result: partial
  details: "All seven typed worker codes map deterministically to existing exception classes, but Aramina projection loses typed failure richness for candidate QC/INFERENCE failures."

ARAMINA FAILURE CONTRACT:
  result: block
  finding: >-
    _map_worker_error(QC_FAILED) returns ModelPreprocessingFailedError with a
    safe_reason such as ARAMINA_UNSUPPORTED_INPUT:preprocessing_contract.
    aramina_failure only preserves failure_stage and preprocessing_diagnostic
    for AraminaWorkflowError; any other ModelRuntimeError becomes the generic
    ARAMINA_EXECUTION_FAILED with no stage/diagnostic. Direct verification
    produced ModelPreprocessingFailedError -> ARAMINA_EXECUTION_FAILED,
    failure_stage=None, preprocessing_diagnostic=None. This changes the
    externally visible candidate Aramina failure contract.
  required_fix: "Preserve the existing AraminaWorkflowError code/stage/diagnostic projection for candidate typed failures, or add an explicit contract-preserving adapter with tests for INPUT_INVALID, QC_FAILED, INFERENCE_FAILED and infrastructure failure."

CONCURRENCY:
  result: pass
  details: "Process-wide nonblocking semaphore limits one candidate invocation and is released in finally on success, timeout and protocol exceptions."

SUBPROCESS ENVIRONMENT:
