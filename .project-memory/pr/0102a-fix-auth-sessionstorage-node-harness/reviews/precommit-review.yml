root_cause: "PR0102 added auth helpers (_getAccessToken, _getRefreshToken, _setTokens, _clearTokens) that directly referenced sessionStorage without guarding for environments where sessionStorage is undefined. Node.js launch-flow harness sets global.window = global but does not define sessionStorage on global, causing ReferenceError when Control Room JS was evaluated."
