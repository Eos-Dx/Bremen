node_harness_behavior: "When sessionStorage unavailable: _getSessionStorage returns null, _getAccessToken returns null, no Authorization header attached, _authFetch calls fetch without Bearer token, refresh skipped, _redirectToLogin is no-op. Same behavior as before PR0102."
