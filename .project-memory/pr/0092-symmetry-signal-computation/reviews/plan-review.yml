reference_statistics_source: "Does not exist in repository. PLAN defines Phase 1 (PR0092) as fail-closed not_available for all signals. Phase 2 requires Slava to deliver a safe aggregate reference-statistics JSON artifact stored in S3 alongside model catalog manifests, referenced by BREMEN_REFERENCE_STATISTICS_URI. Plan specifies expected JSON schema with artifact_type, artifact_version, source_training_run, and signal-specific percentile_bounds containing only percentile cutoffs (no per-patient rows, raw values, or training data)."

feature_to_signal_mapping: "Verified from real source analysis of preprocessing_bridge.py. All 15 features from BREMEN_V01_FEATURE_COLUMNS (line 35) traced through their computation helpers (lines 621-940). Five signal families identified from computational logic: (1) profile_difference_magnitude — sigma_l1/sigma_l2/sigma_r1/sigma_r2/meanrms1/meanrms2 (6 features, 3 unique), (2) weighted_profile_asymmetry — weightedrms1/weightedrms2, (3) statistical_shape_deviation — mahalanobis1/mahalanobis2, (4) distributional_divergence — wasserstein_distance_full_q2/wasserstein_distance_muLR/cosine_distance_full_q2, (5) bilateral_profile_intensity — peak14_intensity/mean_peak_value_raw. Duplicate computations (sigma_l1==meanrms1, sigma_l2==sigma_r2==meanrms2) acknowledged and handled by mapping to same signal. All helpers confirmed as pure numpy functions taking (target, contralateral) mean profiles."

bucketing_method: "Percentile-position bucketing against safe aggregate training-cohort reference distribution. Cutoffs are loaded from controlled artifact, never hardcoded. Per-feature difference_level computed via _percentile_bucket(value, bounds) returning small (value <= bounds.small), moderate (value <= bounds.moderate), or larger (value > bounds.moderate). Per-signal aggregation uses most extreme (highest) level across features. Method justified as deterministic, safe, clinically interpretable, and training-coherent. No fabricated thresholds. No Aramis data reuse."

output_wiring: "External: new symmetry_signals field in build_decision_support_report() output with schema_status, measurement_summary, signals (label + difference_level), note. Internal: symmetry_signal_detail under supporting_technical_evidence in BremenReportProvider._build_report() payload, adding feature_family names, checksum_prefix (first 8 hex chars), reference_artifact_version. Allowed difference_level values: small, moderate, larger, not_available. POST /predictions schema unchanged — new field is additive within existing decision_support_report dict. No new public routes."

not_available_behavior: "Exhaustively defined in PLAN §7.1 with six conditions: artifact not configured, not loaded, checksum invalid, signal missing, feature out of distribution — each maps to not_available with specific schema_status and note. Explicit safety rules: no defaulting to small, no inferring from score, no hiding signals silently, no placeholder/fabricated data. All signals always present in output list."

