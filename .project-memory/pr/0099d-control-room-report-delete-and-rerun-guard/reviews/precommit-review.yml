# ---- PR0099D Core Requirements ----

model_specific_report_lock:
  status: valid
  detail: "Rerun lock key includes source_key + workflow_id + model_id. _find_existing_completed_report(source_key workflow_id model_id) in job_api_handler.py scans all completed jobs matching all three fields. source_key is computed as source_id or upload_id or container_id. report_available must be true for lock to engage. Confirmed by inspect.signature and getsource assertions in tests."

delete_report_endpoint_action:
  status: valid
  detail: "POST /demo/api/jobs with action=delete_report routes to handle_report_delete. delete_report(job_id workflow_id) performs soft-delete by setting report status to REPORT_STATUS_UNAVAILABLE. Response returns only safe metadata: status job_id workflow_id model_id report_deleted. No raw paths S3 internals stack traces or private data exposed. Confirmed by source inspection and safety tests."

backend_duplicate_guard:
  status: valid
  detail: "handle_jobs_create checks _find_existing_completed_report before proceeding with job creation. Returns 409 with error=report_already_exists when a completed report exists for the same source_key+workflow_id+model_id. Guard runs after action routing (delete_report bypasses it) and before job creation. Same source with different model_id passes through unblocked. Confirmed by source inspection."

frontend_disabled_patient_rows:
  status: valid
  detail: "analyzedSourceKeys global object maps {source_key: {model_id: job_id}}. Populated by loadJobHistory() from completed jobs where report_available is true. loadContainerCatalog() applies .cr-container-item.analyzed class with CSS opacity:0.5 pointer-events:none. selectContainer() returns early for analyzed rows. aria-disabled=true and title='Already analyzed with this model' set for accessibility. Confirmed by 5 frontend tests."

frontend_analyze_button_blocked:
  status: valid
  detail: "updateReadiness() computes isAnalyzed from analyzedSourceKeys[selectedSource.id][selectedModelId] and sets btn.disabled=!canSubmit when isAnalyzed is true. Status message shows 'Already analyzed with this model. Delete the report to run again.' startAnalysis() also checks analyzedSourceKeys and returns early if analyzed. Both frontend and backend guards are independent. Confirmed by tests."

model_switch_recomputation:
  status: valid
  detail: "onModelSelect() calls loadJobHistory() which rebuilds analyzedSourceKeys from fresh job data filtered by the new model_id. loadJobHistory() then calls loadContainerCatalog() to re-render patient rows with updated analyzed state. Different model_id produces different analyzed set — previously blocked rows become selectable. Confirmed by test_on_model_select_resets_analyzed_state and test_load_job_history_calls_load_container_catalog."

delete_report_ux:
  status: valid
  detail: "Delete report button appears in Job History for each job with report_available=true. Confirmation dialog: 'Delete this generated report? The patient file will remain available. You can run this model again after deletion.' On success: clears decision card if current job refreshes Job History via loadJobHistory(). Report deleted status shown in Job History. window.deleteReport exported for onclick binding. Confirmed by 8 UX tests."

job_history_report_availability:
  status: valid
  detail: "list_analysis_jobs() returns report_available (boolean from any REPORT_STATUS_AVAILABLE) and report_deleted (derived: not has_available AND overall_status=='completed' AND len(reports)>0). After soft-delete report_available=false and report_deleted=true. Job History renders 'Report deleted' for deleted reports. Open report link only shown when report_available is true. Confirmed by source inspection and tests."

open_report_deleted_state:
  status: valid
  detail: "deleteReport() clears the decision card (cr-decision-card) if the deleted job is the currently viewed job. Job History refresh shows 'Report deleted' status text. No open report link rendered for deleted reports. Confirmed by test_delete_report_clears_decision_card and test_report_deleted_status_in_history."

raw_path_s3_safety:
  status: valid
  detail: "delete_report() contains no s3:// /tmp/ h5_path unlink os.remove or shutil references. Response payload contains only: status job_id workflow_id model_id report_deleted. Frontend deleteReport() sends only action job_id workflow_id. source_key stored as opaque identifier not raw path. Confirmed by safety tests and grep."

same_source_different_model_analyzable:
  status: valid
  detail: "_find_existing_completed_report checks model_id specifically. Same source_key with different model_id does not match the lock condition. Frontend analyzedSourceKeys is keyed by [source_key][model_id] — different model_id entries are independent. Confirmed by grep showing model_id in guard logic and frontend keying."

delete_unlocks_correct_model_only:
  status: valid
  detail: "delete_report(job_id workflow_id) targets a specific job which is model-specific. Soft-delete marks only that job's report as UNAVAILABLE. Other jobs for the same source with different models remain completed with available reports. analyzedSourceKeys only removes the entry for the specific source_key+model_id pair. Confirmed by source inspection."

