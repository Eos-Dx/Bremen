WARNINGS:
  - id: W1
    topic: "Required Change #8 vs Non-goals/Allowed Files"
    detail: >
      PLAN.md Required Change #8 ("Separate Model Release CI/CD from Bremen
      application CI/CD") could be misread as a directive to modify CI
      workflow files. The PLAN's own Non-goals explicitly forbid "CI
      workflows ... changes" and Allowed Files contains no
      .github/workflows/* path, so #8 is only implementable as a
      documentation statement (describing the future separation for a later
      IR gate, most likely IR-03's "new release build workflow"), not an
      actual CI change in this PR. Recommend the coder explicitly phrase
      this as descriptive/future-scoped text and not touch any workflow
      file. Not a blocker because Allowed Files/Non-goals already constrain
      the coder to docs-only, but the wording in PLAN.md invites
      misinterpretation.
  - id: W2
    topic: "'Agreed' architecture framing lacks in-repo evidence trail"
    detail: >
      PLAN.md's Goal states the rebaseline aligns the roadmap with "the
      agreed Model Release, plugin and isolated Worker architecture," but
      no prior committed artifact in this repository (ADR, decision record,
      or prior PLAN) defines or approves "Harness"/"plugin wheel"/
      file-based result-channel terminology before this PLAN introduces it.
      Per project_contract.yml source_of_truth_order, the current task
      prompt is rank 1 and can supply this authority, so this is not
      treated as a blocker, but the coder should avoid asserting in the
      rewritten docs that this design was previously "agreed" elsewhere in
      the repository; it should be framed as newly adopted by this PR,
      consistent with AGENTS.md's evidence-based claim discipline.
  - id: W3
    topic: "ir-01..ir-07 PLAN.md edit scope is open-ended"
    detail: >
      Required Change #10 ("Align IR-01 through IR-07 without changing
      their dependency order") grants edit access to all seven
      .project-memory/pr/ir-0N/PLAN.md files without stating which specific
      sentences must change. Current ir-0N PLAN.md files do not name
      "stdin/stdout JSONL" or contradict a file-based protocol, so in
      practice little or no edit may be required there. Recommend the
      coder treat these edits as terminology-only touch-ups (if any) and
      record "no change required" explicitly per file in
      IMPLEMENTATION_REPORT.md rather than rewriting stage content, to
      avoid incidental scope drift inside an otherwise tightly-scoped
      documentation PR.

