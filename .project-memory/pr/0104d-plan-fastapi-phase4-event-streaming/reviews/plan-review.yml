warnings:
  - |
    The recommended StreamingResponse approach uses run_in_executor to bridge
    the synchronous _event_store.wait_for_events() (threading.Condition) into
    the async FastAPI event loop. This blocks a thread from the default thread
    pool for each SSE connection. For demo-stage concurrency (2-5 connections)
    this is acceptable, but the plan should document the thread pool exhaustion
    risk for higher concurrency and note that run_in_executor should use a
    dedicated ThreadPoolExecutor, not the default run_in_executor(None, ...).
  - |
    TestClient does not support true SSE streaming — streaming responses are
    buffered until the generator completes. The plan correctly addresses this
    with direct generator unit tests, but disconnect behavior testing is
    inherently limited without a real ASGI server. The implementation coder
    should verify disconnect behavior in an integration environment.
  - |
    _PROHIBITED_DETAIL_KEYS enforcement happens at event append time via
    validate_event_details(). If the prohibited keys set is ever modified,
    existing events in the store that were appended under a previous schema
    are not re-validated at read time. The plan could recommend a read-time
    safety filter as defense-in-depth.
  - |
    The plan states the SSE 404 for unknown job_id returns JSON body, not SSE.
    This is correctly copied from existing http.server behavior, but it means
    the EventSource onError handler must parse Content-Type to distinguish 404
    from connection errors. This is existing behavior, not a new concern.
