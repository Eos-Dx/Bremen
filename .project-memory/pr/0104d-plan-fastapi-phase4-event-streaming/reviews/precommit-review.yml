safety_boundary: "No raw S3 bucket/key values, credentials, JWT secrets, env values, filesystem paths, H5 internals, model coefficients, full checksums, or PHI beyond existing safe display names. Read-time safety filter strips prohibited detail keys. Global exception handler prevents raw trace leaks."
