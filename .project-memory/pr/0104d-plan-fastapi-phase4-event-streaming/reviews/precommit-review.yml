json_polling_parity: "Mirrors handle_job_events() exactly. Checks _event_store.has_job(job_id) → 404 if unknown. Reads X-Event-Cursor header for since_sequence. Returns {events, cursor, job_id, request_id, technical_demo_only}. Read-time safety filter via allowed_event_details() strips prohibited detail keys."
sse_parity: "Mirrors handle_job_events_stream() exactly. Unknown job → JSON 404 (not SSE). Reads Last-Event-ID for initial cursor. Streams event: job_event\\ndata: {...}\\n\\n frames. Terminal states: completed, failed, partial_success, workflow_configuration_required. event: stream_complete at terminal. : keepalive\\n\\n heartbeat every 15 seconds. 300-second deadline. Client disconnect → GeneratorExit → silent cleanup."
event_source_of_truth: "Same _event_store singleton from bremen.api.job_api_handler. No second event store created. Same _jobs dict and _jobs_lock shared between http.server and FastAPI routes."
job_id_reconciliation: "Same create_analysis_job() writes to same _event_store and _jobs. FastAPI Phase 3 POST /demo/api/jobs job_ids are immediately visible to Phase 4 event routes. No reconciliation gap."
dedicated_executor: "ThreadPoolExecutor(max_workers=4, thread_name_prefix='fastapi-sse') created at module level inside create_fastapi_app(). 4 workers sufficient for demo-stage concurrency (2-5 concurrent SSE connections)."
default_executor_not_used: "Verified: no run_in_executor(None, ...) in code lines. Only appears in comment explaining why default executor is avoided."
client_disconnect_heartbeat: "Generator uses try/except GeneratorExit for disconnect detection. try/finally for cleanup logging. : keepalive\\n\\n after 15-second wait_for_events timeout. 300-second deadline checked each loop iteration. Generator ends cleanly on disconnect, terminal, or deadline."
read_time_safety_filter: "Added read-time filtering using allowed_event_details() from event_schema.py in both JSON polling and SSE routes. Strips prohibited detail keys before serialization as defense-in-depth. Does not mutate stored events — creates copy via ev.to_dict() before filtering. Plan-review warning about append-time-only validation addressed."
status_vocabulary_preserved: "No new status strings invented. Existing terminal states preserved: completed, failed, partial_success, workflow_configuration_required. 28 EventType enum members unchanged."
terminal_behavior_preserved: "Terminal check under _jobs_lock each loop iteration. Drain remaining events before stream_complete. No false completion after failure. Failure precedence preserved."
stage_completeness_preserved: "Events returned in sequence order (guaranteed by _event_store.get_events()). No deduplication added. No stage vocabulary changed. Control Room UI unchanged. 15-stage pipeline semantics preserved."
server_spawning_tests: "No new tests start real servers. All Phase 4 tests use FastAPI TestClient or direct generator iteration. No existing server-spawning tests removed."
production_dockerfile_unchanged: "ENTRYPOINT [\"python\", \"-m\", \"bremen\"], CMD [\"serve\", \"--host\", \"0.0.0.0\", \"--port\", \"8080\"] — verified unchanged."
