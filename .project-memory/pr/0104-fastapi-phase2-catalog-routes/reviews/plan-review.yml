safety_boundary:
  prohibited_exposures:
    - Raw S3 bucket names
    - Raw S3 object keys
    - Filesystem paths
    - Raw H5 internals
    - PHI / private data beyond patient_display_name
    - Raw exception traces
    - Feature values or model coefficients
    - Model checksums (full hashes)
    - Credentials, JWT secrets, env variable values
  preserved_safety:
    - technical_demo_only: always true
    - source_id: opaque, generated by register_source
    - patient_display_name: cached, same fallback chain
    - _safe_error_detail / _safe_error_detail_str used for exceptions
