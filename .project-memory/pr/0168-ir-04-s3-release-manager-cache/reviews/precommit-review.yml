BLOCKERS:
  - id: IR04-RELEASE-CLOSURE-WHEELHOUSE
    finding: >-
      ReleaseCache accepts BREMEN_RELEASE_WHEELHOUSE and installs dependency
      wheels from that external union directory. The IR-03 manifest declares
      lock files but does not declare or fetch the matching wheel objects;
      --require-hashes authenticates a selected wheel but does not bind the
      dependency closure to this release. The normative contract requires the
      plugin and pinned dependency closure to be release-bound.
    evidence: "src/bremen/platform/models/release_cache.py:181-183,552-567; IMPLEMENTATION_REPORT.md:282-287"
    required_fix: >-
      Publish and fetch a release-declared wheelhouse/complete wheel closure,
      verify every wheel against manifest digests before installation, and
      install only those release-local wheels. Remove dependence on an
      undeclared global union directory.
  - id: IR04-GOLDEN-READY-GATE
    finding: >-
      READY can be written after requirements smoke when
      BREMEN_RELEASE_GOLDEN_FIXTURES is unset. When configured, missing fixture
      files are silently skipped, and successful golden predictions are checked
      only for status rather than release-bound numeric output, threshold and
      other expected result fields. The manifest currently binds only the
      descriptor; required input fixtures are not guaranteed to be fetched.
    evidence: "src/bremen/platform/models/release_cache.py:626-647,661-696; IMPLEMENTATION_REPORT.md:289-290"
    required_fix: >-
      Make every manifest golden case mandatory for READY, bind and download
      its input/expected-output artifacts (including size and SHA-256), fail on
      absent fixtures, execute each through the installed entrypoint, and
      compare the complete expected result within explicit numeric tolerances.
  - id: IR04-TRUSTED-BUCKET-BOUNDARY
    finding: >-
      The public ReleaseCache constructor accepts an arbitrary bucket string
      from its caller. Only the catalog supplies the manifest key; there is no
      trusted platform/catalog configuration object or allowlist preventing a
      caller from selecting another bucket. This does not satisfy the required
      source-authority boundary even though request-time keys are not exposed.
    evidence: "src/bremen/platform/models/release_cache.py:162-180,377-381,443-448"
    required_fix: >-
      Inject a trusted, non-request-configured release source (or validate the
      bucket against the platform release configuration) and keep bucket/key
      selection outside public request data.
  - id: IR04-SUBPROCESS-CREDENTIAL-ISOLATION
    finding: >-
      The scientific subprocess inherits the parent environment because
      _run_command calls subprocess.run without an explicit restricted env.
      AWS credentials and unrelated platform secrets can therefore be exposed
      to the release worker, contrary to the supervisor security contract.
    evidence: "src/bremen/platform/models/release_cache.py:859-864"
    required_fix: >-
      Construct an allowlisted subprocess environment that omits AWS credential
      and platform-secret variables while retaining only required runtime
      configuration.

WARNINGS:
  - id: IR04-RESOURCE-ADMISSION-UNDERCOUNT
    finding: >-
      _admit sums only refs with size_bytes and permits a configurable negative,
      NaN or infinite free_space_factor. The v1 validator allows optional size
      for golden refs, so disk/budget admission can undercount fetched content
      or fail unclearly for pathological configuration.
    evidence: "src/bremen/platform/models/release_cache.py:478-496; src/bremen/contracts/inference_release.py:250-256"
    disposition: "Should be fixed with the closure/golden changes; currently contributes to unsafe admission but is secondary to the blockers above."
  - id: IR04-EVICTION-PROTECTED-BUDGET
    disposition: "Non-blocking and explicitly documented: eviction may remain above budget when all entries are protected; protected and partial entries are not deleted."
  - id: IR04-POSIX-LOCKING
    disposition: "Non-blocking for the declared deployment target; non-POSIX hosts fail closed with lock_unsupported."
  - id: IR04-MATADOR-RAW
    disposition: "Non-blocking inherited IR-03 limitation; no change in this PR."
  - id: IR04-LIVE-AWS
    disposition: "No live S3/App Runner evidence was run or claimed; this is a separate operational gate, not a local code-validation failure."

