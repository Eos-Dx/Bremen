  detail: "'Job History' card title changed to 'Patient Reports' in HTML template (line 1073). Confirmed by grep: 'Patient Reports' present, 'cr-card-title\">Job History' absent from page output. Existing test test_job_history_expands updated to assert 'Patient Reports'."

