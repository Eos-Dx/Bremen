# ---- Appendix B: Failed Job Report Gating ----

failed_job_report_gating_backend:
  status: valid
  detail: "list_analysis_jobs(): Added is_failed = j.overall_status in ('failed', 'normalization_failed'). Changed report_available to has_available and not is_failed. Failed jobs always have report_available=false. get_job_report(): Added early return for failed jobs returning REPORT_STATUS_UNAVAILABLE with reason_code='REPORT_NOT_AVAILABLE'. _find_existing_completed_report(): Already checks job.overall_status == 'completed', so failed jobs never satisfy the rerun guard."

failed_job_report_gating_frontend:
  status: valid
  detail: "loadJobHistory(): Added isFailed check (status==='failed'||status==='normalization_failed'). Failed rows: statusText='Analysis failed', no onclick handler (no openJob), no Delete report button (reportAvail&&!isFailed), no Open report link. Failed rows still show patient_display_name as primary title and model+job_id as metadata."

failed_job_rerun_guard:
  status: valid
  detail: "Failed jobs do not block rerun. _find_existing_completed_report only matches completed jobs. analyzedSourceKeys only populated for jobs with report_available=true. Failed jobs not added to analyzedSourceKeys, so same source+workflow+model remains selectable/analyzable again."

failed_job_safety:
  status: valid
  detail: "Failed report responses contain only status, reason_code, job_id, workflow_id. No raw exceptions, stack traces, paths, S3 keys, H5 internals, feature values, or model internals."

