# ---- PR0099E Core Requirements ----

patient_name_extraction:
  status: valid
  detail: "extract_patient_display_name(h5_path) in job_api_handler.py reads /session/sample/patient_name first, then /scans/target/patient_name, then /scans/contralateral/patient_name. Handles scalar string and bytes values. Returns first safe unambiguous value found. Called in handle_jobs_create() after source resolution and passed to create_analysis_job(patient_display_name=...)."

fallback_fault_tolerance:
  status: valid
  detail: "Extraction is fully fault-tolerant: outer try/except catches h5py import failure, file open failure, and any H5 read error. Inner try/except catches per-dataset read errors. Empty/whitespace-only values rejected. Values >80 chars rejected. Values containing s3:// /tmp/ / \\ traceback exception bucket rejected. Missing/empty h5_path returns empty string immediately. Never raises. Fallback chain in list_analysis_jobs: pdn > filename > container_id > 'Patient'."

patient_display_metadata_propagation:
  status: valid
  detail: "patient_display_name stored in input_summary['patient_display_name'] via create_analysis_job(). Returned by list_analysis_jobs() as summary['patient_display_name']. Used as first choice in source_display_name fallback chain (pdn or filename or container_id or 'Patient'). Frontend loadJobHistory() populates patientNamesBySource[source_key] cache. loadContainerCatalog() uses cache for Patients List display."

