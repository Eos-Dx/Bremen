# Agent: plan-review

verdict: approved
blockers: []
warnings:
  - |
    tests/test_bremen_fastapi_app.py does not exist in the repository
    (verified: ls tests/ shows test_bremen_fastapi_auth_enforcement.py,
    test_bremen_fastapi_demo_routes.py, test_bremen_fastapi_phase*.py,
    but no test_bremen_fastapi_app.py). The PLAN.md VALIDATION PLAN and
    implementation step 5 reference this file. The command
    'python -m pytest -q tests/test_bremen_fastapi_app.py -v' will fail
    with pytest exit code 4 (file not found). Coder must either create
    tests/test_bremen_fastapi_app.py or map the planned ticket tests onto
    the existing test_bremen_fastapi_auth_enforcement.py (currently 25
    tests, matching the plan's regression claim).
  - |
    TokenClaims (src/bremen/auth.py) has no job_id or purpose fields, and
    _decode_token() returns TokenClaims. decode_stream_ticket() must
    therefore either extend TokenClaims, decode the payload separately to
    read the job_id/purpose claims, or return a new ticket-claims type.
    The plan does not specify how job_id/purpose survive the _decode_token
    round-trip; coder must resolve this without weakening type isolation.
  - |
    The fall-through rule (step 2c: invalid/expired Bearer access token
    falls through to ticket check) means a request with an expired access
    token plus a valid ticket passes. This is intentional and additive
    (documented in PLAN.md SSE fallback step 2c), but reviewers should
    confirm the coder preserves the exact ordering: valid Bearer first,
    ticket second, 401 otherwise.
  - |
    The ticket JWT (token_type=stream_ticket) is signed with the same
    HS256 secret as access/refresh tokens and appears in URL query
    strings (?auth_ticket=...). Replay risk is bounded by the 60s TTL,
    job_id binding, purpose binding, and token_type isolation, and is
    documented in the plan's single-use decision. Acceptable for the
    demo scope.
