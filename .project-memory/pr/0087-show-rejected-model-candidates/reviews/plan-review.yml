review:
  status: valid
  head: 063730fcac87b6a1036f2576049b325246cacdb7
  branch: 0087-show-rejected-model-candidates
  blockers: []
  warnings:
    - id: W001
      evidence:
        file: .project-memory/pr/0087-show-rejected-model-candidates/PLAN.md
        lines: Start page CSS section
      issue: The current start_page_ui.css uses opacity: 0.5 for .model-card.disabled. The spec Section 7 says opacity reduction for content but does not specify an exact percentage. The PLAN proposes 0.4. The spec only says "opacity reduction" without an exact value.
      recommendation: Set disabled-card content opacity to 0.4 for visual consistency with the design intent, but confirm the exact value against the committed BREMEN_DESIGN_SPEC_v1.md. If the spec is silent on the exact value, 0.4 is a reasonable choice.
    - id: W002
      evidence:
        file: .project-memory/pr/0087-show-rejected-model-candidates/PLAN.md
        lines: Log sanitization section
      issue: The PLAN identifies that _log.warning at s3_model_discovery.py line ~550 uses str(exc)[:100] which can leak field names like threshold, coef. The PLAN correctly proposes replacing this with safe reason_category strings. However, the existing log also includes manifest_key for Phase 1 failures. The PLAN notes manifest_key is server-private logging but should not coexist with model_id in Phase 3 logs. This requires careful implementation.
      recommendation: Replace str(exc)[:100] with safe reason_category in all Phase 3 rejection logs. Ensure manifest_key appears only in Phase 1 logs and model_id appears only in Phase 2/3 logs. Never combine both in the same log line.
    - id: W003
      evidence:
        file: .project-memory/pr/0087-show-rejected-model-candidates/PLAN.md
        lines: Duplicate display_name selection
      issue: The PLAN selects the lexicographically first non-empty display_name among duplicate manifests for the disabled card. This is deterministic but may select an arbitrary-seeming name if two manifests carry different display_name values for the same model_id.
      recommendation: Document this behavior in the registry code comment. Accept the lexicographic choice as deterministic and stable across restarts.

