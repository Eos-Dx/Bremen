candidate_inventory:
  scanner: "_discover_package_directories() replacing _list_candidate_manifests()"
  counts_immediate_child_directories: true
  accepts_manifest_json_only: true
  accepts_dot_joblib_only: true
  accepts_both: true
  rejects_nested_directories: true
  deterministic_sort_by_directory_name: true
  candidate_count_semantic: unique package directories containing manifest.json or .joblib

data_model:
  new_type: CatalogUnavailableEntry in model_registry.py
  kind_enum:
    - identified
    - unregistered
  reason_category_enum:
    - not_compatible
    - duplicate_entry
    - unregistered_package
  extended_registry:
    - unavailable_entries: tuple[CatalogUnavailableEntry]
    - last_discovery_at: str
  unavailable_count: computed from len(unavailable_entries)
  immutable_snapshot: true
  identifier_generation: deterministic generic ordinal labels

api_contract:
  unavailable_models: new array in GET /demo/api/models
  unavailable_count: new int field
  last_discovery_at: new str field
  existing_fields_unchanged: true
  resolve_model_rejects_unavailable: true
  model_version_endpoint_unchanged: true

start_page_ui:
  disabled_cards_rendered: true
  disabled_card_css:
    class: ".model-card.disabled"
    aria-disabled: true
    opacity: 0.4
    cursor: not-allowed
  status_rail_unavailable:
    background: "#9AA3A8 (--status-unconfigured)"
    color: "#FFFFFF"
  reason_caption_not_compatible: "Not compatible with the current runtime"
  reason_caption_duplicate_entry: "Duplicate model identity"
  reason_caption_unregistered_package: "Model package is not registered"
  catalog_caption_present: true
  catalog_caption_format: "Catalog: X of Y discovered models available \u00b7 last checked HH:MM AM/PM"
  catalog_discovery_failed_caption: "Catalog: discovery unavailable"
  non_interactive_structure:
    - not in radiogroup
    - role presentation
    - no click handlers
    - no Enter/Space handlers

catalog_observability:
  fields:
    - catalog_status (existing status field)
    - candidate_count (existing)
    - available_count (existing)
    - rejected_count (existing)
    - unavailable_count (new)
    - last_discovery_at (new ISO-8601 UTC)
