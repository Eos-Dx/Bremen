summary: |
  PLAN verified against all 30 review checks and 15 blocking conditions.
  The plan delivers product visibility for every discovered Joblib model
  candidate: available models remain selectable and executable, non-compliant
  candidates appear as disabled non-interactive cards with safe reason
  categories, and Joblib-only candidates without safe manifest identity
  appear as generic unregistered packages. Raw rejection detail never
  reaches public API or UI. Catalog observability exposes only safe counts,
  status enum, and last discovery timestamp via a small caption. The Start
  page reuses BREMEN_DESIGN_SPEC_v1.md Section 2.7 disabled-card treatment
  with opacity reduction and full-opacity status rails. PR0086
  adapt_model_package fix confirmed present. Current production log
  diagnosis correct (v0.1 accepted, v0.2.0 rejected missing threshold).
  Twenty test scenarios defined across three test classes including grep
  checks for no-leak API/UI behavior. No blockers identified. Three
  non-blocking warnings about exact opacity value, log sanitization
  carefulness, and duplicate display_name selection documentation.
