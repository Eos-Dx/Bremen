  detail: "run_workflow_request() retains optional job_id: str | None = None. create_analysis_job() passes job_id=job_id. No call sites in server.py/app.py/inference_handler.py modified. Decision card padding var(--sp-24) preserved. PR0099B tests pass."

# ---- Appendix A: Model/Report Binding ----

model_report_binding:
  status: valid
  detail: "Reports are per-job (AnalysisJob.reports dict keyed by workflow_id, not source-level). Each create_analysis_job() call produces a unique job_id via str(_uuid.uuid4()). No source-level dedup, caching, or report reuse logic exists. Same source can produce separate jobs/reports for different model_id values. No Aramis behavior implemented."

selected_model_request_contract:
  status: valid
  detail: "startAnalysis() sends body.model_id=selectedModelId in POST /demo/api/jobs. handle_jobs_create() reads model_id from body (line 772, optional via body.get('model_id')). Passes model_id=model_id to create_analysis_job(). No new required fields added to /demo/api/jobs schema."

report_lookup_model_specificity:
  status: valid
  detail: "Reports are accessed via GET /demo/api/jobs/{job_id}/reports — bound to specific job_id, not source_id. get_job_reports() returns reports from job.reports dict (per-job). get_job_report() generates fresh report from job's own workflow result and model_identity. No source-level report caching."

same_source_multiple_models:
  status: valid
  detail: "Each create_analysis_job() generates unique job_id. input_summary stores model_id. Job history filters by model_id (server-side). Two jobs for same source, different model_id values are separate records with distinct job_ids, reports, and events."

open_report_job_model_binding:
  status: valid
  detail: "openJob navigates to /demo/report/{jobId} — job-specific URL. Decision card report link uses /demo/report/' + jobId. fetchDecision fetches /demo/api/jobs/{jobId} (the specific job, not source-level). No source-level open report function."

job_history_model_identity:
  status: valid
  detail: "loadJobHistory() sends model_id query parameter (line 568: params.append('model_id', selectedModelId)). Server-side list_analysis_jobs() filters by model_id (line 597-599). Job History displays model_id in each row (j.model_id, truncated to 16 chars). Multiple jobs for same source with different model_ids appear as separate rows."

aramis_future_safety:
  status: valid
  detail: "Only model/report identity contract made future-safe. No Aramis-specific behavior implemented. The PR0099 implementation report explicitly states 'Not implemented. Only future-safe identity contract fixed.'"

