# ---- PR0099C Core Requirements ----

missing_event_types:
  status: valid
  detail: "All four missing event types are emitted. runtime.artifact.load.completed (line 458), runtime.artifact.adaptation.completed (line 472), and runtime.model.validation.completed (line 480, conditional on validation_status == 'completed') are emitted in BremenProvider.prepare_artifact(). runtime.features.completed (line 393) is emitted in BremenProvider.execute() after successful build_features(). All four are mapped in execution_trace.py _STAGE_EVENT_MAP (lines 32-36) and control_room_ui.py STAGE_MAP (lines 195-199)."

event_job_id_identity:
  status: valid
  detail: "PR0099B preserved. run_workflow_request() at workflow_orchestrator.py line 156 accepts job_id: str | None = None (keyword-only, default None). create_analysis_job() passes job_id=job_id to both run_workflow_request calls (lines 457, 466). All events emitted via context.emit() use the same visible job_id."

event_order_and_truthfulness:
  status: valid
  detail: "Events are emitted in correct chronological 15-row pipeline order: verification → load (NEW) → adaptation (NEW) → model validation (NEW) → input preparation → features (NEW) → features validation → inference → output validation → decision → report. The model validation event is conditionally emitted only when validation_status == 'completed' — it does not claim success when the operation failed (workflow_bremen.py line 478-486)."

execution_trace_finalization:
  status: valid
  detail: "build_trace_from_events() in execution_trace.py (line 127-151) now checks for terminal workflow completion events (runtime.workflow.completed, runtime.request.completed). Priority order: (1) all 11 stages completed → 'completed', (2) terminal failure event → 'failed', (3) terminal completion event + at least 1 completed stage → 'completed' (legacy/missing events path), (4) partial stages, no terminal → 'running', (5) no stages → 'not_started'."

completed_trace_stage_statuses:
  status: valid
  detail: "With all four events emitted and mapped, artifact_loaded, artifact_adapted, model_validated, and features_produced are no longer left as 'not_started' for a successful completed job. Test test_trace_status_completed_with_all_11_stages confirms all 11 stages are 'completed' and trace.status == 'completed'."

failed_trace_behavior:
  status: valid
  detail: "Failed trace correctly receives status='failed' when runtime.workflow.failed exists. No code marks all stages as completed on failure. The terminal failure check precedes the terminal completion check, so a failed job with some completed stages does not produce 'completed' status."

control_room_terminal_summary:
  status: valid
  detail: "collapseEventPanel() (control_room_ui.py line 799) uses pipelineTotal = Object.keys(STAGE_MAP).length (always 15) as the denominator, not eventCache.length. Completed summary: 'Analysis complete · X of 15 pipeline stages completed'. No '1 of 1 events', no '10 of 14', no '9 of 9'. Tests test_completed_summary_contains_15_of_15, test_completed_summary_no_one_of_one_events, test_completed_summary_no_10_of_14, test_completed_summary_no_9_of_9 confirm."

tiny_score_formatting:
  status: valid
  detail: "fetchDecision() (control_room_ui.py line 758-764) implements three-branch formatting: prob === 0 → 'Score 0.000', prob < 0.001 → 'Score <0.001', otherwise prob.toFixed(3). Same logic for threshold. Confirmed by grep: lines 758, 759, 762, 764 contain '<0.001', '0.000', 'toFixed(3)'."

missing_score_formatting:
  status: valid
  detail: "Null/undefined/!isFinite(prob) renders 'Score —'. Null/undefined/!isFinite(thresh) renders 'Threshold —'. Confirmed in control_room_ui.py lines 762-764."

source_display_patient_name:
  status: valid
  detail: "handle_jobs_create() (job_api_handler.py lines 791-811) looks up source_info via get_source_info(source_id) for a filename. Falls back to source_id split('/')[-1] basename, then 'Patient'. For upload_id, looks up staged upload filename, falls back to 'Patient'. list_analysis_jobs() (line 572) fallback is 'Patient', not 'Unknown'. Test test_list_analysis_jobs_fallback_is_patient_not_unknown confirms '\"Unknown\"' not in source."

raw_path_s3_safety:
  status: valid
  detail: "s3:// only appears inside resolve_source() (job_api_handler.py line 275) which is unmodified — internal S3 download path only. No s3://, /tmp/, bucket names, S3 prefixes, filesystem paths, H5 internal paths, raw exceptions, stack traces, credentials, tokens, PHI, feature values, or model coefficients appear in user-facing display derivation. Confirmed by grep and safety tests."

pr0098_preservation:
