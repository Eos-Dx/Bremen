plan_followed: "Implementation follows PR0101 PLAN.md and THREAT_MODEL.md. AuthConfig dataclass, argon2id password verification, PyJWT HS256 tokens, safe error handling, route protection, and frontend login all match the approved plan."
dependencies_added: "PyJWT>=2.0 and argon2-cffi>=21.0 added to requirements.txt. No other dependencies. No bcrypt (argon2-cffi preferred per plan)."
config_implemented: "AuthConfig dataclass in config.py with read_auth_config(env=None). Never raises. Records validation_error. Auth disabled by default. Fail closed when enabled but incomplete. JWT secret min 32 chars, distinct from password hash. TTL bounds enforced."
auth_module_implemented: "auth.py: verify_password() with argon2id, create_access_token()/create_refresh_token() with HS256, decode_access_token()/decode_refresh_token() with explicit algorithms=['HS256'], authenticate_credentials() with generic failure, parse_bearer_header()/authenticate_request() middleware. Claims: sub, iat, exp, token_type, jti, iss (optional), aud (optional)."
token_endpoint_implemented: "POST /demo/api/auth/token: Success returns access_token, refresh_token, token_type, expires_in. Invalid credentials returns 401 generic error. Auth disabled returns 503."
refresh_endpoint_implemented: "POST /demo/api/auth/refresh: Success returns new token pair. Invalid/expired/wrong-type returns 401 generic error. Auth disabled returns 503."
route_protection_implemented: "Protected POST endpoints: upload, stage, analyze, create job/delete report. Public GET endpoints: all read routes, auth endpoints, login page. Protection checks Bearer header and token validity before handler execution."
frontend_integration_implemented: "Login page at GET /demo/login with username/password form. sessionStorage for tokens. Redirects to /demo/control-room on success. _authFetch() wrapper in Control Room JS attaches Bearer token to protected POSTs. On 401: attempts refresh, retries once. On refresh failure: clears sessionStorage, redirects to login."
auth_disabled_behavior: "When BREMEN_AUTH_ENABLED is not set or 'false': all routes remain public, no auth enforcement, read_auth_config returns enabled=False. Existing behavior fully preserved."
auth_enabled_behavior: "When BREMEN_AUTH_ENABLED=true with complete config: protected POST endpoints require valid Bearer access token. Missing/invalid/expired returns 401. Incomplete config returns 503."
auth_does_not_expand_visibility: "Auth gates actions only, not data. Same handler functions serve authed and unauthed requests. Auth check only gates whether handler runs at all. No additional data exposed after login."
safe_error_handling: "Generic 'Authentication failed' for all auth errors. No stack traces. No config details. No JWT parse internals. Safe logging: 'auth.login.failed', 'auth.token.issued'."
jwt_algorithm_safety: "decode uses explicit algorithms=['HS256']. Tests verify alg=none rejected, alg=HS512 rejected. JWT secret must be independently generated and distinct from password hash."
password_hashing: "argon2id via argon2-cffi. No plaintext compare. verify_password() uses PasswordHasher.verify(). Malformed hash rejected."
refresh_token_tradeoff: "Stateless refresh JWT accepted for demo stage. No server-side revocation before natural expiry. Documented in implementation report warnings. Real logout/revoke requires server-side token state later."
no_true_revocation_claim: "Implementation does not claim true logout/revocation. Stateless refresh JWT trade-off is documented and accepted for demo stage."
no_secrets_or_default_credentials: "No hardcoded credentials in source. No default passwords. Tests verify absence of demo-password, changeme, secret123. All credential references are env var names."
no_raw_private_data_exposure: "Auth does not unlock full checksums, raw features, H5 internals, S3 refs, model coefficients, PHI, or exception traces. Same handlers serve both authed and unauthed requests."
